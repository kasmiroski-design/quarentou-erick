<style>
  /* Layout: vitrine em grade (2 colunas no celular); tocar num presente abre uma folha com o Pix. */
  :root {
    --bg: #1a110b;
    --surface: #2b1b11;
    --fg: #f3e6cf;
    --muted: #b9a283;
    --line: #5a3d25;
    --accent: #d9a24f;
    --accent-fg: #1f1209;
    --gold: #f0cf8e;
    --ok-bg: #3d2d12;
    --err: #ff9a8a;
    --font-display: "Rye", Rockwell, Georgia, serif;
    --font-body: "Josefin Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background-color: var(--bg);
    background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.24) 0 2px, transparent 2px 92px), linear-gradient(180deg, #26170e, #150d08);
    background-attachment: fixed;
    color: var(--fg);
    font: 16px/1.5 var(--font-body);
    padding-block: 28px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 980px; margin: 0 auto; }
  header { display: grid; gap: 10px; margin-bottom: 22px; }
  .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent); display: inline-flex; align-items: center; gap: 10px;
  }
  .eyebrow::before { content: ""; width: 28px; height: 4px; border-radius: 2px; background: var(--gold); }
  h1 { font: 400 clamp(34px, 10vw, 56px)/1.05 var(--font-display); letter-spacing: .01em; color: var(--gold); text-shadow: 0 2px 0 rgba(0,0,0,.55); margin: 0; text-wrap: balance; }
  .lead { color: var(--muted); margin: 0; max-width: 50ch; }

  .tools { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin-bottom: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; min-width: 0; }
  .chip {
    all: unset; box-sizing: border-box; cursor: pointer; min-height: 40px; padding: 0 14px;
    display: inline-flex; align-items: center; border-radius: 99px; font-size: 14px; font-weight: 700;
    box-shadow: inset 0 0 0 1.5px var(--line); color: var(--fg);
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); box-shadow: none; }
  .chip, .sort { letter-spacing: .04em; }
  .chip:focus-visible, .sort:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .sort {
    min-height: 40px; padding: 0 12px; border-radius: 10px; font: 700 14px var(--font-body);
    color: var(--fg); background: var(--surface); border: 1.5px solid var(--line);
  }
  .count { font-size: 13px; color: var(--muted); margin: 0 0 12px; }

  ul.grid {
    list-style: none; margin: 0; padding: 0; display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 164px), 1fr));
  }
  ul.grid > li { min-width: 0; display: flex; }
  .card {
    all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; gap: 10px; align-content: start;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 10px 14px;
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .tile {
    aspect-ratio: 1 / 1; max-width: 100%; border-radius: 10px; position: relative; overflow: hidden;
    background: radial-gradient(circle at 50% 28%, #4b3120, #1d120a 88%);
    display: grid; place-items: center;
  }
  .tile svg { width: 86%; height: 86%; display: block; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .paid-tag {
    position: absolute; top: 8px; right: 8px; font-size: 11px; font-weight: 700; color: var(--accent);
    background: var(--ok-bg); padding: 2px 8px; border-radius: 99px;
  }
  .card .nm { font: 700 13px/1.3 var(--font-body); letter-spacing: .06em; text-transform: uppercase; padding-inline: 2px; overflow-wrap: anywhere; }
  .card .pr { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); padding-inline: 2px; }

  .hero {
    display: block; width: 100%; max-width: 100%; aspect-ratio: 4 / 3.3; object-fit: cover; object-position: top;
    border-radius: 18px; border: 1px solid var(--line); box-shadow: 0 12px 32px rgba(0,0,0,.5); margin-bottom: 24px;
  }
  .scrim {
    position: fixed; inset: 0; z-index: 30; background: rgba(8, 16, 12, .55);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    width: 100%; max-width: 480px; max-height: 92vh; max-height: 92dvh; overflow-y: auto;
    background: var(--surface); border-radius: 22px 22px 0 0;
    padding: 18px 18px calc(22px + env(safe-area-inset-bottom, 0px));
    padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
    display: grid; gap: 16px; align-content: start;
  }
  @media (min-width: 640px) {
    .scrim { align-items: center; padding: 24px; }
    .sheet { border-radius: 22px; }
  }
  .sheet-head { display: flex; align-items: center; gap: 14px; }
  .thumb { width: 64px; height: 64px; flex: none; border-radius: 12px; background: radial-gradient(circle at 50% 28%, #4b3120, #1d120a 88%); display: grid; place-items: center; overflow: hidden; }
  .thumb svg { width: 88%; height: 88%; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .sheet-head .ttl { flex: 1; min-width: 0; }
  .sheet-head h2 { font: 400 22px/1.2 var(--font-display); margin: 0; overflow-wrap: anywhere; }
  .sheet-head .sub { font-size: 13px; color: var(--muted); }
  .x {
    all: unset; box-sizing: border-box; cursor: pointer; width: 44px; height: 44px; flex: none; border-radius: 12px;
    display: grid; place-items: center; font-size: 26px; line-height: 1; box-shadow: inset 0 0 0 1.5px var(--line);
  }
  .x:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .qr-wrap { display: grid; justify-items: center; gap: 8px; }
  .qr { background: #fff; padding: 12px; border-radius: 12px; width: min(220px, 70%); line-height: 0; border: 1px solid var(--line); }
  .qr svg { width: 100%; height: auto; display: block; }
  .qr-cap { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
  .total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; color: var(--muted); }
  .total strong { color: var(--fg); font: 400 24px var(--font-display); font-variant-numeric: tabular-nums; }
  label.lbl { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  textarea.code {
    width: 100%; margin-top: 6px; resize: none; height: 96px; padding: 10px 12px;
    font: 500 12px/1.4 var(--font-mono); color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; word-break: break-all;
  }
  .btn {
    all: unset; box-sizing: border-box; cursor: pointer; text-align: center;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px; padding: 0 18px; border-radius: 12px; font-weight: 700;
    background: var(--accent); color: var(--accent-fg);
  }
  .btn.block { display: flex; width: 100%; }
  .btn.ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--line); }
  .btn.small { min-height: 38px; padding: 0 14px; font-size: 14px; }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .btn:active { transform: translateY(1px); }
  ol.steps { margin: 0; padding-left: 20px; color: var(--muted); font-size: 14px; display: grid; gap: 4px; }
  ol.steps b { color: var(--fg); }
  .receipt { font-size: 14px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 14px; display: grid; gap: 10px; }
  .receipt .mail { font-family: var(--font-mono); font-size: 13px; color: var(--fg); overflow-wrap: anywhere; }
  .rrow { display: flex; flex-wrap: wrap; gap: 8px; }
  .stack { display: grid; gap: 16px; }
  .free-input { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .free-input span { font-weight: 700; }
  .free-input input {
    flex: 1; min-width: 0; min-height: 48px; padding: 0 12px; font: 700 20px var(--font-body);
    font-variant-numeric: tabular-nums; color: var(--fg); background: var(--bg);
    border: 1.5px solid var(--line); border-radius: 10px;
  }
  .free-input input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .err { color: var(--err); font-size: 13px; margin: 4px 0 0; }

  footer { margin-top: 36px; display: grid; gap: 8px; font-size: 14px; color: var(--muted); }
  footer .keyline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  footer code { font: 500 13px var(--font-mono); color: var(--fg); overflow-wrap: anywhere; }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); background: var(--fg); color: var(--bg);
    padding: 10px 18px; border-radius: 99px; font-weight: 700; font-size: 14px; z-index: 40;
  }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
  .musbtn {
    all: unset; box-sizing: border-box; cursor: pointer; position: fixed; z-index: 35;
    right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    min-height: 44px; padding: 0 16px; border-radius: 99px; display: inline-flex; align-items: center; gap: 8px;
    font: 700 14px var(--font-body); letter-spacing: .04em; background: var(--accent); color: var(--accent-fg);
    box-shadow: 0 6px 18px rgba(0,0,0,.45);
  }
  .musbtn[aria-pressed="true"] { background: var(--surface); color: var(--gold); box-shadow: inset 0 0 0 1.5px var(--accent), 0 6px 18px rgba(0,0,0,.45); }
  .musbtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  body.has-mus main { padding-bottom: 64px; }
</style>

    belt: function (a, b, c) { return '<rect x="6" y="42" width="88" height="16" rx="3" fill="' + a + '"/><rect x="36" y="33" width="26" height="34" rx="4" fill="none" stroke="' + c + '" stroke-width="5"/><circle cx="74" cy="50" r="2" fill="' + b + '"/><circle cx="82" cy="50" r="2" fill="' + b + '"/><circle cx="90" cy="50" r="2" fill="' + b + '"/>'; },
    backpack: function (a, b, c) { return '<path d="M38 24Q50 6 62 24" fill="none" stroke="' + b + '" stroke-width="5"/><rect x="24" y="22" width="52" height="66" rx="18" fill="' + a + '"/><rect x="34" y="52" width="32" height="26" rx="8" fill="' + b + '"/><path d="M34 63H66" stroke="' + c + '" stroke-width="3"/>'; },
    suitcase: function (a, b) { return '<path d="M40 24V14H60V24" fill="none" stroke="' + b + '" stroke-width="5"/><rect x="20" y="24" width="60" height="58" rx="10" fill="' + a + '"/><path d="M36 30V76M64 30V76" stroke="' + b + '" stroke-width="3" opacity=".6"/><circle cx="34" cy="88" r="4" fill="' + b + '"/><circle cx="66" cy="88" r="4" fill="' + b + '"/>'; },
    perfume: function (a, b, c) { return '<rect x="40" y="8" width="20" height="15" rx="3" fill="' + b + '"/><rect x="45" y="23" width="10" height="9" fill="' + c + '"/><rect x="24" y="32" width="52" height="56" rx="12" fill="' + a + '"/><rect x="34" y="46" width="32" height="26" rx="6" fill="' + c + '" opacity=".85"/><circle cx="50" cy="59" r="5" fill="' + b + '"/>'; },
    beads: beads,
    cuff: function (a, b, c) { return '<ellipse cx="50" cy="54" rx="32" ry="30" fill="none" stroke="' + a + '" stroke-width="11"/><rect x="42" y="14" width="16" height="13" rx="3" fill="' + c + '" stroke="' + b + '" stroke-width="2"/>'; },
    necklace: function (a, b, c) { return '<path d="M18 18Q50 96 82 18" fill="none" stroke="' + b + '" stroke-width="3"/><path d="M50 52L60 63L50 78L40 63Z" fill="' + a + '"/><path d="M50 52L60 63H40Z" fill="' + c + '"/>'; },
    watch: function (a, b, c) { return '<rect x="38" y="4" width="24" height="92" rx="8" fill="' + b + '"/><circle cx="50" cy="50" r="27" fill="' + a + '"/><circle cx="50" cy="50" r="21" fill="' + c + '"/><path d="M50 50V35M50 50L60 56" stroke="' + b + '" stroke-width="3" stroke-linecap="round"/>'; },
    band: function (a, b, c) { return '<rect x="40" y="4" width="20" height="92" rx="9" fill="' + b + '"/><rect x="32" y="30" width="36" height="40" rx="10" fill="' + a + '"/><rect x="37" y="35" width="26" height="30" rx="6" fill="' + c + '"/><path d="M41 52L46 52L50 44L54 60L57 52L59 52" fill="none" stroke="' + b + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'; },
    headphones: function (a, b) { return '<path d="M20 60V50Q20 16 50 16Q80 16 80 50V60" fill="none" stroke="' + b + '" stroke-width="6"/><rect x="12" y="48" width="20" height="34" rx="9" fill="' + a + '"/><rect x="68" y="48" width="20" height="34" rx="9" fill="' + a + '"/>'; },
    earbuds: function (a, b, c) { return '<rect x="22" y="44" width="56" height="42" rx="16" fill="' + a + '"/><path d="M22 60H78" stroke="' + b + '" stroke-width="3"/><circle cx="50" cy="74" r="3" fill="' + c + '"/><circle cx="36" cy="28" r="9" fill="' + c + '"/><circle cx="64" cy="28" r="9" fill="' + c + '"/><rect x="33" y="30" width="6" height="15" rx="3" fill="' + c + '"/><rect x="61" y="30" width="6" height="15" rx="3" fill="' + c + '"/>'; },
    speaker: function (a, b, c) { return '<rect x="28" y="10" width="44" height="80" rx="14" fill="' + a + '"/><circle cx="50" cy="36" r="9" fill="' + c + '"/><circle cx="50" cy="65" r="15" fill="' + b + '"/><circle cx="50" cy="65" r="6" fill="' + c + '"/>'; },
    powerbank: function (a, b, c) { return '<rect x="28" y="10" width="44" height="80" rx="10" fill="' + a + '"/><rect x="38" y="24" width="24" height="5" rx="2" fill="' + c + '"/><rect x="38" y="34" width="24" height="5" rx="2" fill="' + c + '"/><rect x="38" y="44" width="24" height="5" rx="2" fill="' + c + '" opacity=".5"/><rect x="42" y="76" width="16" height="6" rx="2" fill="' + b + '"/>'; },
    shades: function (a, b, c) { return '<path d="M6 38H94" stroke="' + b + '" stroke-width="5"/><path d="M12 38Q14 68 32 68Q48 68 48 48V40H12Z" fill="' + b + '"/><path d="M88 38Q86 68 68 68Q52 68 52 48V40H88Z" fill="' + b + '"/><path d="M18 46Q20 56 28 57" stroke="' + c + '" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M62 46Q64 56 72 57" stroke="' + c + '" stroke-width="3" fill="none" stroke-linecap="round"/>'; },
    thermos: function (a, b, c) { return '<rect x="34" y="6" width="32" height="15" rx="5" fill="' + b + '"/><rect x="30" y="18" width="40" height="78" rx="10" fill="' + a + '"/><rect x="30" y="48" width="40" height="12" fill="' + c + '" opacity=".7"/>'; },
    mug: function (a, b, c) { return '<path d="M24 32H66V70Q66 88 50 88H40Q24 88 24 70Z" fill="' + a + '"/><path d="M66 40H76Q86 40 86 52Q86 64 76 64H66" fill="none" stroke="' + a + '" stroke-width="7"/><path d="M36 10Q40 18 36 25M48 10Q52 18 48 25M60 10Q64 18 60 25" stroke="' + c + '" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="24" y="44" width="42" height="8" fill="' + b + '" opacity=".35"/>'; },
    book: function (a, b, c) { return '<path d="M20 12H76Q80 12 80 16V84Q80 88 76 88H24Q20 88 20 84Z" fill="' + a + '"/><rect x="20" y="12" width="10" height="76" fill="' + b + '"/><rect x="40" y="30" width="30" height="5" rx="2" fill="' + c + '"/><rect x="40" y="42" width="22" height="4" rx="2" fill="' + c + '" opacity=".7"/>'; },
    dice: function (a, b, c) { return '<rect x="16" y="32" width="46" height="46" rx="9" fill="' + a + '"/><circle cx="28" cy="44" r="4" fill="' + c + '"/><circle cx="50" cy="44" r="4" fill="' + c + '"/><circle cx="39" cy="55" r="4" fill="' + c + '"/><circle cx="28" cy="66" r="4" fill="' + c + '"/><circle cx="50" cy="66" r="4" fill="' + c + '"/><rect x="58" y="16" width="30" height="30" rx="7" fill="' + b + '" transform="rotate(14 73 31)"/><circle cx="73" cy="31" r="3.5" fill="' + c + '"/>'; },
    candle: function (a, b, c) { return '<path d="M50 6Q61 19 50 30Q39 19 50 6Z" fill="' + c + '"/><rect x="48" y="28" width="4" height="10" fill="' + b + '"/><rect x="24" y="38" width="52" height="50" rx="10" fill="' + a + '"/><rect x="24" y="54" width="52" height="14" fill="' + c + '" opacity=".5"/>'; },
    plant: function (a, b, c) { return '<path d="M50 58Q28 52 26 22Q50 26 50 58Z" fill="' + c + '"/><path d="M50 58Q72 46 76 16Q52 22 50 58Z" fill="' + a + '"/><path d="M50 62Q38 50 26 56Q34 70 50 62Z" fill="' + a + '" opacity=".8"/><path d="M26 62H74L67 92H33Z" fill="' + b + '"/>'; },
    skincare: function (a, b, c) { return '<rect x="46" y="6" width="28" height="8" rx="3" fill="' + b + '"/><rect x="46" y="12" width="9" height="16" fill="' + b + '"/><rect x="28" y="28" width="44" height="62" rx="12" fill="' + a + '"/><rect x="36" y="48" width="28" height="26" rx="6" fill="' + c + '" opacity=".85"/>'; },
    camera: function (a, b, c) { return '<rect x="10" y="30" width="80" height="54" rx="10" fill="' + a + '"/><rect x="24" y="20" width="22" height="12" rx="3" fill="' + b + '"/><circle cx="50" cy="58" r="21" fill="' + b + '"/><circle cx="50" cy="58" r="14" fill="' + c + '"/><circle cx="50" cy="58" r="6" fill="' + b + '"/><circle cx="78" cy="41" r="3" fill="' + c + '"/>'; },
    controller: function (a, b, c) { return '<path d="M26 34H74Q92 34 94 62Q96 80 82 80Q72 80 68 70H32Q28 80 18 80Q4 80 6 62Q8 34 26 34Z" fill="' + a + '"/><path d="M26 50V62M20 56H32" stroke="' + c + '" stroke-width="4" stroke-linecap="round"/><circle cx="70" cy="52" r="4" fill="' + c + '"/><circle cx="80" cy="60" r="4" fill="' + c + '"/><circle cx="44" cy="60" r="3" fill="' + b + '"/><circle cx="56" cy="60" r="3" fill="' + b + '"/>'; },
    voucher: function (a, b, c) { return '<path d="M8 28H92V44Q84 44 84 50Q84 56 92 56V72H8V56Q16 56 16 50Q16 44 8 44Z" fill="' + a + '"/><path d="M64 30V70" stroke="' + c + '" stroke-dasharray="4 4" stroke-width="2"/><circle cx="38" cy="50" r="12" fill="' + c + '"/><path d="M38 43V57M33 47Q38 42 43 47M33 53Q38 58 43 53" stroke="' + b + '" stroke-width="2.5" fill="none" stroke-linecap="round"/>'; }
  };
  var uid = 0;
  function iconHtml(item) {
    if (item.img) return '<img src="' + item.img + '" alt="">';
    var h = item.hue, g = "g" + (++uid);
    function grad(id, l1, l2, s) {
      return '<linearGradient id="' + g + id + '" gradientUnits="userSpaceOnUse" x1="12" y1="4" x2="88" y2="96">' +
        '<stop offset="0" stop-color="hsl(' + h + " " + s + "% " + l1 + '%)"/>' +
        '<stop offset="1" stop-color="hsl(' + h + " " + s + "% " + l2 + '%)"/></linearGradient>';
    }
    var defs = grad("a", 60, 30, 64) + grad("b", 34, 13, 55) + grad("c", 92, 68, 78);
    var a = "url(#" + g + "a)", b = "url(#" + g + "b)", c = "url(#" + g + "c)";
    var fn = DRAW[item.type] || DRAW.voucher;
    return '<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><defs>' + defs + "</defs>" +
      '<ellipse cx="50" cy="94" rx="30" ry="3.6" fill="#000" opacity=".16"/>' +
      '<g transform="translate(5 1) scale(.9)" filter="url(#fx3d)">' + fn(a, b, c) + "</g></svg>";
  }

  // ----- Pix Copia e Cola (BR Code estático) -----
  function tlv(id, val) { return id + String(val.length).padStart(2, "0") + val; }
  function crc16(str) {
    var crc = 0xFFFF;
    for (var i = 0; i < str.length; i++) {
      crc ^= str.charCodeAt(i) << 8;
      for (var j = 0; j < 8; j++) {
        crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
        crc &= 0xFFFF;
      }
    }
    return crc.toString(16).toUpperCase().padStart(4, "0");
  }
  function pixPayload(amount) {
    var merchant = tlv("00", "br.gov.bcb.pix") + tlv("01", PIX_KEY.toLowerCase());
    var body =
      tlv("00", "01") + tlv("01", "11") + tlv("26", merchant) + tlv("52", "0000") + tlv("53", "986") +
      tlv("54", amount.toFixed(2)) + tlv("58", "BR") + tlv("59", RECEIVER_NAME.slice(0, 25)) +
      tlv("60", RECEIVER_CITY.slice(0, 15)) + tlv("62", tlv("05", "***")) + "6304";
    return body + crc16(body);
  }

  // ----- utilidades -----
  var toastEl = document.getElementById("toast"), toastTimer;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 2200);
  }
  function copyText(text, fallbackEl, okMsg) {
    function fallback() {
      try {
        var t = fallbackEl;
        if (!t) { t = document.createElement("textarea"); t.value = text; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); }
        t.focus(); t.select();
        var ok = document.execCommand("copy");
        if (!fallbackEl) t.remove();
        toast(ok ? okMsg : "Segure o texto selecionado e escolha Copiar");
      } catch (e) { toast("Selecione o texto e copie manualmente"); }
    }
    try { navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback); }
    catch (e) { fallback(); }
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  var paid = [];
  try { paid = JSON.parse(localStorage.getItem("gift-paid") || "[]"); } catch (e) { paid = []; }
  function savePaid() { try { localStorage.setItem("gift-paid", JSON.stringify(paid)); } catch (e) {} }

  // ----- folha de pagamento -----
  var scrim = document.getElementById("scrim"), body = document.getElementById("sheet-body"), lastFocus = null;

  function buildPix(target, item, amount) {
    var payload = pixPayload(amount);
    var wrap = el("div", "qr-wrap");
    var qrBox = el("div", "qr");
    try {
      var qr = qrcode(0, "M"); qr.addData(payload); qr.make();
      qrBox.innerHTML = qr.createSvgTag(4, 0);
      var svg = qrBox.querySelector("svg");
      if (svg) { svg.removeAttribute("width"); svg.removeAttribute("height"); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "QR Code Pix de " + brl.format(amount)); }
    } catch (e) { qrBox.style.display = "none"; }
    wrap.appendChild(qrBox);
    wrap.appendChild(el("p", "qr-cap", "No computador, leia com a câmera do app do seu banco."));
    target.appendChild(wrap);

    var total = el("div", "total");
    total.appendChild(el("span", null, item.name));
    total.appendChild(el("strong", null, brl.format(amount)));
    target.appendChild(total);

    var box = el("div");
    var lbl = el("label", "lbl", "Pix Copia e Cola"); lbl.htmlFor = "code-" + item.id;
    var ta = el("textarea", "code"); ta.id = "code-" + item.id; ta.readOnly = true; ta.value = payload;
    ta.addEventListener("focus", function () { ta.select(); });
    box.appendChild(lbl); box.appendChild(ta);
    target.appendChild(box);

    var copy = el("button", "btn block", "Copiar código Pix"); copy.type = "button";
    copy.addEventListener("click", function () { copyText(payload, ta, "Código Pix copiado"); });
    target.appendChild(copy);

    var steps = el("ol", "steps");
    steps.innerHTML = "<li>Abra o app do seu banco e escolha <b>Pix</b>.</li><li>Toque em <b>Pix Copia e Cola</b> e cole o código.</li><li>Confira o valor e o recebedor e confirme o pagamento.</li>";
    target.appendChild(steps);

    var rc = el("div", "receipt");
    rc.appendChild(el("span", null, "O comprovante fica salvo no seu banco. Se quiser mandar uma cópia para o aniversariante, use este e-mail:"));
    rc.appendChild(el("span", "mail", PIX_KEY));
    var rrow = el("div", "rrow");
    var cm = el("button", "btn ghost small", "Copiar e-mail"); cm.type = "button";
    cm.addEventListener("click", function () { copyText(PIX_KEY, null, "E-mail copiado"); });
    var done = el("button", "btn small", paid.indexOf(item.id) >= 0 ? "Pagamento marcado" : "Já paguei"); done.type = "button";
    done.addEventListener("click", function () {
      if (paid.indexOf(item.id) < 0) { paid.push(item.id); savePaid(); }
      done.textContent = "Pagamento marcado";
      toast("Obrigado pelo presente!");
      renderGrid();
    });
    rrow.appendChild(cm); rrow.appendChild(done);
    rc.appendChild(rrow);
    target.appendChild(rc);
  }

  function buildFree(target, item) {
    var box = el("div");
    var lbl = el("label", "lbl", "Quanto você quer dar?"); lbl.htmlFor = "free-amount";
    var row = el("div", "free-input");
    row.appendChild(el("span", null, "R$"));
    var inp = el("input"); inp.id = "free-amount"; inp.type = "text"; inp.inputMode = "decimal"; inp.placeholder = "0,00"; inp.autocomplete = "off";
    row.appendChild(inp);
    var go = el("button", "btn", "Gerar Pix"); go.type = "button";
    row.appendChild(go);
    var err = el("p", "err"); err.hidden = true;
    box.appendChild(lbl); box.appendChild(row); box.appendChild(err);
    target.appendChild(box);
    var result = el("div", "stack");
    target.appendChild(result);
    function gen() {
      var raw = inp.value.replace(/\s/g, "").replace(/\./g, "").replace(",", ".");
      var v = parseFloat(raw);
      result.textContent = "";
      if (!isFinite(v) || v < 1) { err.textContent = "Digite um valor a partir de R$ 1,00."; err.hidden = false; return; }
      if (v > 100000) { err.textContent = "Valor acima do limite desta página."; err.hidden = false; return; }
      err.hidden = true;
      buildPix(result, { id: item.id, name: "Presente em dinheiro" }, Math.round(v * 100) / 100);
    }
    go.addEventListener("click", gen);
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") gen(); });
  }

  function openSheet(item) {
    lastFocus = document.activeElement;
    var sheet = scrim.firstElementChild;
    sheet.style.setProperty("--h", item.hue);
    document.getElementById("thumb").innerHTML = iconHtml(item);
    document.getElementById("sheet-title").textContent = item.name;
    document.getElementById("sheet-sub").textContent = item.price == null ? "Você escolhe o valor" : brl.format(item.price);
    body.textContent = "";
    if (item.price == null) buildFree(body, item); else buildPix(body, item, item.price);
    scrim.hidden = false;
    document.body.style.overflow = "hidden";
    document.getElementById("close").focus();
  }
  function closeSheet() {
    if (scrim.hidden) return;
    scrim.hidden = true;
    document.body.style.overflow = "";
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  document.getElementById("close").addEventListener("click", closeSheet);
  scrim.addEventListener("click", function (e) { if (e.target === scrim) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });

  // ----- vitrine -----
  var gridEl = document.getElementById("grid"), chipsEl = document.getElementById("chips"), countEl = document.getElementById("count"), sortEl = document.getElementById("sort");
  var cats = ["Todos"];
  ITEMS.forEach(function (i) { if (cats.indexOf(i.cat) < 0) cats.push(i.cat); });
  var activeCat = "Todos";

  function renderChips() {
    chipsEl.textContent = "";
    cats.forEach(function (c) {
      var b = el("button", "chip", c); b.type = "button";
      b.setAttribute("aria-pressed", c === activeCat ? "true" : "false");
      b.addEventListener("click", function () { activeCat = c; renderChips(); renderGrid(); });
      chipsEl.appendChild(b);
    });
  }
  function renderGrid() {
    var list = ITEMS.filter(function (i) { return activeCat === "Todos" || i.cat === activeCat; });
    if (sortEl.value === "menor") list.sort(function (x, y) { return x.price - y.price; });
    if (sortEl.value === "maior") list.sort(function (x, y) { return y.price - x.price; });
    countEl.textContent = list.length + (list.length === 1 ? " presente" : " presentes") + (activeCat === "Todos" ? "" : " em " + activeCat) + ", de " + brl.format(Math.min.apply(null, list.map(function (i) { return i.price; }))) + " a " + brl.format(Math.max.apply(null, list.map(function (i) { return i.price; })));
    var all = list.concat([FREE_ITEM]);
    gridEl.textContent = "";
    all.forEach(function (item) {
      var li = el("li");
      var card = el("button", "card"); card.type = "button";
      card.style.setProperty("--h", item.hue);
      var tile = el("div", "tile"); tile.innerHTML = iconHtml(item);
      if (paid.indexOf(item.id) >= 0) tile.appendChild(el("span", "paid-tag", "Pago"));
      card.appendChild(tile);
      card.appendChild(el("span", "nm", item.name));
      card.appendChild(el("span", "pr", item.price == null ? "Você escolhe" : brl.format(item.price)));
      card.addEventListener("click", function () { openSheet(item); });
      li.appendChild(card);
      gridEl.appendChild(li);
    });
  }
  sortEl.addEventListener("change", renderGrid);

  document.getElementById("keytxt").textContent = PIX_KEY;
  document.getElementById("copykey").addEventListener("click", function () { copyText(PIX_KEY, null, "Chave Pix copiada"); });
  renderChips();
  renderGrid();
})();
</script>
<script>
// Música do convite: toca quando a lista é aberta pelo link direto.
// Dentro do convite a lista abre num quadro e a música já vem do convite, então aqui fica desligada.
(function () {
  var inFrame = false;
  try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
  if (inFrame) return;
  var START = 37, btn = document.getElementById("musBtn"), on = false, userOff = false;
  var a = new Audio("../musica.mp3");
  a.preload = "auto";
  btn.hidden = false; document.body.classList.add("has-mus");
  function label() { btn.textContent = on ? "❚❚ Pausar música" : "♫ Tocar música"; btn.setAttribute("aria-pressed", on ? "true" : "false"); }
  function seek() { try { if (a.currentTime < START) a.currentTime = START; } catch (e) {} }
  function ready() { seek(); if (!on && !userOff) a.play().then(function () { on = true; label(); }).catch(function () {}); }
  if (a.readyState >= 1) ready(); else a.addEventListener("loadedmetadata", ready, { once: true });
  function start() {
    seek();
    var p = a.play();
    on = true; label();
    if (p && p.catch) p.catch(function () { on = false; label(); });
  }
  function stop() { a.pause(); on = false; label(); }
  a.addEventListener("ended", function () { try { a.currentTime = START; } catch (e) {} a.play().catch(function () {}); });
  btn.addEventListener("click", function () { if (on) { userOff = true; stop(); } else { userOff = false; start(); } });
  function firstTouch(e) {
    if (userOff || on || e.target === btn) return;
    start();
  }
  document.addEventListener("click", firstTouch, true);
  document.addEventListener("touchend", firstTouch, true);
})();
</script>
