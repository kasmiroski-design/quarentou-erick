name: fotos-presentes
on:
  push:
    branches: [fotos-tmp]
    paths: ['_fotos/unsplash.json', '_fotos/baixar.py']
permissions:
  contents: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests
      - run: python _fotos/baixar.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _fotos
          git commit -m "Fotos candidatas para a lista de presentes" || echo "nada novo"
          git push
